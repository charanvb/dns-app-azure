name: Deploy Python App to Azure App Service

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'terraform/**'
      - 'learn-azureCLI/**'
      - '*.md'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bnlwe-fs01-n-00000-dns-webapp
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Build React frontend
      run: |
        cd frontend
        npm install
        npm run build
        echo "✅ React app built successfully"
        ls -la dist/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies (for validation)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .

    - name: Wait for app warmup
      run: sleep 30

    - name: Health check
      run: |
        curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || exit 1
        echo "✅ App is healthy!"
