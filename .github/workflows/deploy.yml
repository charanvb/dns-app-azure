name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'terraform/**'
      - 'learn-azureCLI/**'
      - '*.md'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: bnlwe-fs01-n-00000-dns-webapp
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Import sanity check
      run: python -m py_compile $(git ls-files 'app/*.py' 'dns_engine/*.py')

    - name: Run tests
      run: |
        if [ -d tests ]; then pytest -q; else echo "No tests directory yet, skipping"; fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .

    - name: Wait for app warmup
      run: sleep 30

    - name: Health check
      run: |
        curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health || exit 1
        echo "✅ App is healthy!"
