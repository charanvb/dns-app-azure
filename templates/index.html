<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body { background-color: #f8f9fa; }
      .hero-card { max-width: 560px; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand fw-semibold">&#127758; {{ app_name }}</span>
        <span class="badge bg-light text-primary" style="font-size:.75rem">
          v{{ app_version }} &bull; {{ environment }}
        </span>
      </div>
    </nav>

    <main class="container d-flex justify-content-center align-items-center" style="min-height:85vh">
      <div class="hero-card card shadow-sm w-100">
        <div class="card-body text-center py-5">
          <div class="display-1 mb-3">&#x2705;</div>
          <h1 class="card-title h3 fw-bold">Hello, World!</h1>
          <p class="card-text text-muted mt-2">
            The <strong>{{ app_name }}</strong> is running on
            <strong>Azure Container Apps</strong>.
          </p>
          <hr class="my-4" />
          <p class="text-secondary small mb-0">Milestone 1 &mdash; Service is healthy and reachable.</p>
          <a href="/docs" class="btn btn-outline-primary btn-sm mt-3">API Docs</a>
          <a href="/health" class="btn btn-outline-success btn-sm mt-3 ms-2">Health Check</a>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmR9BCFjk5RBTE9Cr2U9jX+bUs3"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
