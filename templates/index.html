{% extends "base.html" %}

{% block title %}{{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:70vh">
  <div class="card shadow-sm" style="max-width:480px;width:100%">
    <div class="card-body text-center py-5">
      <div class="display-1 mb-3">&#x2705;</div>
      <h1 class="card-title h3 fw-bold">Hello, World!</h1>
      <p class="card-text text-muted mt-2">
        The <strong>{{ app_name }}</strong> is running on
        <strong>Azure Container Apps</strong>.
      </p>
      <hr class="my-4" />
      <p class="text-secondary small mb-0">Milestone 1 &mdash; Service is healthy and reachable.</p>
      <a href="/docs" class="btn btn-outline-primary btn-sm mt-3">API Docs</a>
      <a href="/health" class="btn btn-outline-success btn-sm mt-3 ms-2">Health Check</a>
    </div>
  </div>
</div>
{% endblock %}
