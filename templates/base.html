<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #0078d4;
            --sidebar-width: 250px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 56px;
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - 56px);
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            z-index: 100;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: calc(100vh - 56px);
        }
        .navbar-brand {
            font-weight: 600;
        }
        .nav-link.active {
            background-color: #e7f3ff;
            color: var(--primary-color) !important;
            border-left: 3px solid var(--primary-color);
        }
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-loading {
            opacity: 0.7;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-globe2"></i> {{ app_name }}
            </a>
            <span class="navbar-text text-white-50 ms-auto">
                <small>{{ environment | upper }} | v{{ app_version }}</small>
            </span>
        </div>
    </nav>

    <!-- Sidebar -->
    <aside class="sidebar">
        <nav class="nav flex-column p-3">
            <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                <i class="bi bi-house-door"></i> Dashboard
            </a>
            <a class="nav-link {% if request.url.path.startswith('/zones') %}active{% endif %}" href="/zones">
                <i class="bi bi-diagram-3"></i> DNS Zones
            </a>
            <a class="nav-link {% if request.url.path.startswith('/request') %}active{% endif %}" href="/request">
                <i class="bi bi-plus-circle"></i> New Request
            </a>
            <hr>
            <a class="nav-link" href="/api/docs" target="_blank">
                <i class="bi bi-code-square"></i> API Docs
            </a>
            <a class="nav-link" href="/api/health" target="_blank">
                <i class="bi bi-heart-pulse"></i> Health Check
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
