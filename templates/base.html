<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      .sidebar {
        min-height: calc(100vh - 56px);
        background: #fff;
        border-right: 1px solid #dee2e6;
      }
      .sidebar .nav-link { color: #495057; }
      .sidebar .nav-link.active,
      .sidebar .nav-link:hover { color: #0d6efd; background-color: #e9ecef; border-radius: .375rem; }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="/">&#127758; {{ app_name }}</a>
        <span class="badge bg-light text-primary" style="font-size:.75rem">
          v{{ app_version }} &bull; {{ environment }}
        </span>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar py-3">
          <ul class="nav flex-column gap-1">
            <li class="nav-item">
              <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                &#x1F3E0; Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.url.path.startswith('/zones') %}active{% endif %}" href="/zones">
                &#x1F310; DNS Zones
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.url.path.startswith('/request') %}active{% endif %}" href="/request">
                &#x1F4DD; New Request
              </a>
            </li>
          </ul>
        </nav>

        <main class="col-md-10 py-4 px-4">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmR9BCFjk5RBTE9Cr2U9jX+bUs3"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
